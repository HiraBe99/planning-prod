# Fabrique l'app de bureau (Mac et Windows) à partir de la page du site (index.html), sur les machines de GitHub.
# Lancement : onglet « Actions » → « App de bureau » → « Run workflow », ou automatiquement quand le dossier desktop change (nouvelle version de l'app).
name: App de bureau
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**']
concurrency: { group: app-bureau, cancel-in-progress: true }
jobs:
  fabriquer:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: La page du site dans l'app
        shell: bash
        run: |
          cp index.html manifest.webmanifest icone-*.png desktop/web/
          # accès Google de l'app de bureau : rangé dans les secrets du dépôt (Settings → Secrets and variables → Actions), posé ici au moment de fabriquer
          sed -i.bak -e "s|DESK_CLIENT_ID|${DESK_CLIENT_ID}|" -e "s|DESK_CLIENT_SECRET|${DESK_CLIENT_SECRET}|" desktop/web/index.html && rm desktop/web/index.html.bak
        env:
          DESK_CLIENT_ID: ${{ secrets.DESK_CLIENT_ID }}
          DESK_CLIENT_SECRET: ${{ secrets.DESK_CLIENT_SECRET }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.targets }}' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - run: npm install
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: 'Planning prod, app de bureau v__VERSION__'
          releaseBody: "Mac : télécharger le fichier .dmg. Windows : télécharger le fichier -setup.exe."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
